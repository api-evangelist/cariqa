aid: cariqa
name: Cariqa
description: >-
  Cariqa provides backend-to-backend payment and access infrastructure for EV
  charging across Europe. Its Connect API lets OEMs, mobility services, fleets
  and platforms offer electric-vehicle charging through a single integration —
  discovering charging stations and live connector availability, creating and
  managing users, collecting payment methods via Stripe (PSD2/SCA compliant),
  starting and stopping charging sessions on 900,000+ charge points, and
  retrieving session history, debts and invoices. Cariqa removes reseller
  markups so charge point operators set the price drivers pay, while platforms
  earn a transaction revenue share. Backed by Anthemis and Techstars.
