  /api/v1/users/{user_id}/charging/stop/{session_id}/:
    post:
      operationId: users_charging_stop_create
      description: Stop charging session
      summary: Stop Charging Session
      parameters:
        - in: path
          name: session_id
          schema:
            type: string
          required: true
        - in: path
          name: user_id
          schema:
            type: string
          required: true
      tags:
        - Charging Sessions
      security:
        - BearerAuth: []
      responses:
        '204':
