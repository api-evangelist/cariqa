components:
  schemas:
    AccountTypeEnum:
      enum:
        - personal
        - business
      type: string
      description: |-
        * `personal` - personal
        * `business` - business
    AmenitiesEnum:
      enum:
        - HOTEL
        - RESTAURANT
        - CAFE
        - MALL
        - SUPERMARKET
        - SPORT
        - RECREATION_AREA
        - NATURE
        - MUSEUM
        - BUS_STOP
        - TAXI_STAND
        - TRAIN_STATION
        - AIRPORT
        - CARPOOL_PARKING
        - FUEL_STATION
        - WIFI
      type: string
      description: |-
        * `HOTEL` - HOTEL
        * `RESTAURANT` - RESTAURANT
        * `CAFE` - CAFE
        * `MALL` - MALL
        * `SUPERMARKET` - SUPERMARKET
        * `SPORT` - SPORT
        * `RECREATION_AREA` - RECREATION_AREA
        * `NATURE` - NATURE
        * `MUSEUM` - MUSEUM
        * `BUS_STOP` - BUS_STOP
        * `TAXI_STAND` - TAXI_STAND
        * `TRAIN_STATION` - TRAIN_STATION
        * `AIRPORT` - AIRPORT
        * `CARPOOL_PARKING` - CARPOOL_PARKING
        * `FUEL_STATION` - FUEL_STATION
        * `WIFI` - WIFI
    ConnectAPIBillingDetails:
      type: object
      description: |-
        Serializer which is used to serialize data with the possible business
        details if exist
      properties:
        country:
          type: string
          nullable: true
          maxLength: 150
        city:
          type: string
          nullable: true
          maxLength: 50
        tax_id:
          type: string
          nullable: true
          maxLength: 30
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        company_name:
          type: string
          nullable: true
        vat_id:
          type: string
          nullable: true
        line1:
          type: string
        postal_code:
          type: string
        first_name:
          type: string
          nullable: true
          maxLength: 150
        last_name:
          type: string
          nullable: true
          maxLength: 150
      required:
        - line1
        - postal_code
    ConnectAPICardPM:
      type: object
      properties:
        brand:
          type: string
          description: 'Card brand. Example: visa'
        last4:
          type: string
          description: Last 4 digits of the card number
        expiration_date:
          type: string
          description: 'Expiration date of the card. Format: MM/YY'
        cardholder_name:
          type: string
          nullable: true
          description: Cardholder name, if present
      required:
        - brand
        - cardholder_name
        - expiration_date
        - last4
    ConnectAPIChargingSession:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        end_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: integer
          readOnly: true
          nullable: true
        consumed_energy:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        evse_id:
          type: string
          readOnly: true
        station_info:
          allOf:
            - $ref: '#/components/schemas/StationInfo'
          readOnly: true
        is_partner:
          type: boolean
          readOnly: true
        logo_url:
          type: string
          nullable: true
          description: Return station's operator logo url.
          readOnly: true
        user_facing_session_prices:
          allOf:
            - $ref: '#/components/schemas/ConnectAPIUserFacingSessionPrices'
          readOnly: true
        session_cost:
          allOf:
            - $ref: '#/components/schemas/ConnectAPIPAYGSummary'
          readOnly: true
        rates:
          nullable: true
          minimum: 0
          maximum: 32767
          oneOf:
            - $ref: '#/components/schemas/RatesEnum'
            - $ref: '#/components/schemas/NullEnum'
      required:
        - consumed_energy
        - duration
        - end_time
        - evse_id
        - id
        - is_active
        - is_partner
        - logo_url
        - session_cost
        - start_time
        - station_info
        - user_facing_session_prices
    ConnectAPIDebt:
      type: object
      properties:
        session_id:
          type: string
          description: Unique identifier of the charging session
        payment_intent_client_secret:
          type: string
          description: Stripe Client Secret which should be used to pay the debt
        amount:
          type: string
          description: Amount of the debt to charge
        currency:
          type: string
          description: '3-letter currency of the debt (Example: EUR)'
      required:
        - amount
        - currency
        - payment_intent_client_secret
        - session_id
    ConnectAPIEvse:
      type: object
      properties:
        evse_id:
          type: string
        status:
          $ref: '#/components/schemas/ConnectAPIEvseStatusEnum'
      required:
        - evse_id
        - status
    ConnectAPIEvseStatusEnum:
      enum:
        - AVAILABLE
        - BLOCKED
        - CHARGING
        - INOPERATIVE
        - OUTOFORDER
        - PLANNED
        - REMOVED
        - RESERVED
        - UNKNOWN
      type: string
      description: |-
        * `AVAILABLE` - AVAILABLE
        * `BLOCKED` - BLOCKED
        * `CHARGING` - CHARGING
        * `INOPERATIVE` - INOPERATIVE
        * `OUTOFORDER` - OUTOFORDER
        * `PLANNED` - PLANNED
        * `REMOVED` - REMOVED
        * `RESERVED` - RESERVED
        * `UNKNOWN` - UNKNOWN
    ConnectAPIInvoiceList:
      type: object
      description: |-
        Extended invoice list serializer (payg flow should have session id).

        :param charging_session_id: Id of the corresponding charging session.
      properties:
        link:
          type: string
          description: Link to download the invoice
        total:
          type: string
          description: Total amount of the invoice
        date:
          type: string
          format: date-time
          description: Date of the invoice
        refund:
          type: boolean
          description: Whether the invoice has been refunded
        charging_session_id:
          type: string
          nullable: true
          description: Unique identifier of the charging session
        currency:
          type: string
          description: Currency used for billing
      required:
        - currency
        - date
        - link
        - refund
        - total
    ConnectAPIOpeningTimes:
      type: object
      properties:
        twentyfourseven:
          type: boolean
        regular_hours:
          type: array
          items:
            $ref: '#/components/schemas/ConnectAPIRegularHours'
      required:
        - regular_hours
        - twentyfourseven
    ConnectAPIPAYGSummary:
      type: object
      description: PAYG summary serializer.
      properties:
        kwh_cost:
          type: string
          nullable: true
          description: KWH-based part of the charging session cost
        time_cost:
          type: string
          nullable: true
          description: TIME-based part of the charging session cost
        session_fee_cost:
          type: string
          nullable: true
          description: One-off session fee as a part of the charging session cost
        blocking_fee_cost:
          type: string
          nullable: true
          description: Blocking fee cost as a part of the charging session cost
        starting_fee_cost:
          type: string
          nullable: true
          description: One-off Cariqa fee as a part of the charging session cost
        invoice_download:
          type: string
          nullable: true
          description: URL to download the invoice
          readOnly: true
        invoice_vat:
          type: string
          description: VAT applied to the invoice
        invoice_summary:
          type: string
          description: Summary of the invoice
        invoice_credits:
          type: string
          description: >-
            Credits applied to the invoice. Has negative value in case discount
            applied. Rarely can have positive value
        invoice_discount:
          type: string
          description: Discount applied to the invoice
        currency:
          type: string
          readOnly: true
          description: Currency used for billing
      required:
        - blocking_fee_cost
        - currency
        - invoice_credits
        - invoice_discount
        - invoice_download
        - invoice_summary
        - invoice_vat
        - kwh_cost
        - session_fee_cost
        - starting_fee_cost
        - time_cost
    ConnectAPIPM:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the payment method given by Stripe
        default:
          type: boolean
          description: Whether this is the default payment method for the user
        type:
          allOf:
            - $ref: '#/components/schemas/ConnectAPIPMTypeEnum'
          description: |-
            Type of the payment method. Example: card

            * `card` - card
            * `apple_pay` - apple_pay
            * `google_pay` - google_pay
        card:
          allOf:
            - $ref: '#/components/schemas/ConnectAPICardPM'
          description: Payment method details
        created_at:
          type: string
          description: Timestamp of when the payment method was attached to the user
      required:
        - card
        - created_at
        - default
        - id
        - type
    ConnectAPIPMTypeEnum:
      enum:
        - card
        - apple_pay
        - google_pay
      type: string
      description: |-
        * `card` - card
        * `apple_pay` - apple_pay
        * `google_pay` - google_pay
    ConnectAPIPartnerFilterOperator:
      type: object
      description: This class is used to serialize the operators list info
      properties:
        name:
          type: string
        logo_url:
          type: string
          format: uri
          nullable: true
      required:
        - logo_url
        - name
    ConnectAPIPriceGroup:
      type: object
      description: Serializer for OCPI station details.
      properties:
        type:
          type: string
        power:
          type: number
          format: double
        evse_ids:
          type: array
          items:
            type: string
        prices:
          $ref: '#/components/schemas/ConnectAPIPrices'
        local_datetime:
          type: string
          format: date-time
        currency:
          type: string
        pre_authorization_amount:
          type: string
        is_fallback:
          type: boolean
          default: false
          description: Whether this is the price set by Cariqa because no prices from CPOs
      required:
        - currency
        - evse_ids
        - local_datetime
        - power
        - pre_authorization_amount
        - prices
        - type
    ConnectAPIPrices:
      type: object
      properties:
        time_price:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimePriceItem'
          nullable: true
          description: 'TIME-based price. Example: 0.22 EUR/min'
        kwh_price:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimePriceItem'
          nullable: true
          description: 'KWH-based price. Example: 0.55 eur/kwh'
        blocking_fee:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimePriceItem'
          nullable: true
          description: >-
            Fees related for the vehicle being overstaying on the charging lot.
            Time-based. Example: 0.10 EUR/min after 240 min.
        session_fee:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimePriceItem'
          nullable: true
          description: 'One-off fee for charging. Example: 0.50 EUR'
        starting_fee:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimePriceItem'
          nullable: true
          description: 'One-off fee for charging billed by Cariqa. Example: 0.59 EUR'
    ConnectAPIRegularHours:
      type: object
      properties:
        weekday:
          $ref: '#/components/schemas/WeekdayEnum'
        period_begin:
          type: string
          nullable: true
        period_end:
          type: string
          nullable: true
      required:
        - period_begin
        - period_end
    ConnectAPISetupIntent:
      type: object
      properties:
        setup_intent_client_secret:
          type: string
      required:
        - setup_intent_client_secret
    ConnectAPIStartChargingRequest:
      type: object
      description: |-
        Start charge request serializer.

        :param evse_id: Evse id of the station to charge at.
        :param payment_method_id: Stripe id of the payment method
         which should be used for PAYG.
        :param car_id: Id of the car to charge.
      properties:
        evse_id:
          type: string
        payment_method_id:
          type: string
      required:
        - evse_id
        - payment_method_id
    ConnectAPIStation:
      type: object
      description: Serializer for OCPI station details.
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
        speed:
          $ref: '#/components/schemas/SpeedEnum'
        address:
          type: string
        status:
          $ref: '#/components/schemas/Status80fEnum'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        opening_times:
          $ref: '#/components/schemas/ConnectAPIOpeningTimes'
        operator:
          $ref: '#/components/schemas/OCPIOperatorInfo'
        evses:
          type: array
          items:
            $ref: '#/components/schemas/ConnectAPIEvse'
        last_updated:
          type: string
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/AmenitiesEnum'
        is_partner:
          type: boolean
          default: false
        price_groups:
          type: array
          items:
            $ref: '#/components/schemas/ConnectAPIPriceGroup'
        logo_url:
          type: string
          format: uri
      required:
        - address
        - coordinates
        - evses
        - id
        - last_updated
        - name
        - opening_times
        - operator
        - price_groups
    ConnectAPITileResponse:
      type: object
      properties:
        type:
          type: string
          default: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/TilesFeatureCollection'
      required:
        - features
    ConnectAPIUser:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          nullable: true
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        custom_properties:
          allOf:
            - $ref: '#/components/schemas/ConnectAPIUserCustomProperties'
          nullable: true
      required:
        - id
    ConnectAPIUserCustomProperties:
      type: object
      properties:
        external_id:
          type: string
          nullable: true
          description: External id of the user provided by Connect backend
          maxLength: 250
    ConnectAPIUserFacingSessionPrices:
      type: object
      properties:
        kwh_price:
          type: string
          nullable: true
          readOnly: true
          description: KWH-based price applied to session and used for billing
        time_price:
          type: string
          nullable: true
          readOnly: true
          description: TIME-based price applied to session and used for billing
        session_fee:
          type: string
          nullable: true
          readOnly: true
          description: One-off fee applied to session and used for billing
        blocking_fee:
          type: string
          nullable: true
          readOnly: true
          description: >-
            Merged info about the blocking fees applied to session and used for
            billing
        starting_fee:
          type: string
          nullable: true
          readOnly: true
          description: One-off Cariqa fee applied to session and used for billing
        grace_period_minutes:
          type: integer
          nullable: true
          description: Amount of time in minutes after which blocking fees starts to apply
        blocking_cap:
          type: string
          nullable: true
          description: >-
            Maximum amount of blocking fees which can be charged in one
            transaction.
        currency:
          type: string
          maxLength: 3
      required:
        - blocking_cap
        - blocking_fee
        - grace_period_minutes
        - kwh_price
        - session_fee
        - starting_fee
        - time_price
    Contact:
      type: object
      properties:
        phone:
          type: string
          nullable: true
    Coordinates:
      type: object
      properties:
        latitude:
          type: string
        longitude:
          type: string
      required:
        - latitude
        - longitude
    Detail:
      type: object
      description: 400 status error message response serializer.
      properties:
        detail:
          type: string
      required:
        - detail
    Error:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/ErrorTypeEnum'
          description: |-
            Type of the error

            * `validation_error` - validation_error
            * `payment_method_error` - payment_method_error
            * `payment_error` - payment_error
            * `temporary_locked` - temporary_locked
            * `already_charging` - already_charging
            * `already_stopped` - already_stopped
            * `station_availability_issue` - station_availability_issue
            * `billing_data_required` - billing_data_required
            * `charging_provider_error` - charging_provider_error
            * `unexpected_error` - unexpected_error
            * `pre_authorization_failed` - pre_authorization_failed
        details:
          type: string
          description: Additional details about the error
        payment_intent_client_secret:
          type: string
          description: Client secret of the payment intent that failed
      required:
        - details
        - type
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
        error:
          $ref: '#/components/schemas/Error'
      required:
        - detail
        - error
    ErrorTypeEnum:
      enum:
        - validation_error
        - payment_method_error
        - payment_error
        - temporary_locked
        - already_charging
        - already_stopped
        - station_availability_issue
        - billing_data_required
        - charging_provider_error
        - unexpected_error
        - pre_authorization_failed
      type: string
      description: |-
        * `validation_error` - validation_error
        * `payment_method_error` - payment_method_error
        * `payment_error` - payment_error
        * `temporary_locked` - temporary_locked
        * `already_charging` - already_charging
        * `already_stopped` - already_stopped
        * `station_availability_issue` - station_availability_issue
        * `billing_data_required` - billing_data_required
        * `charging_provider_error` - charging_provider_error
        * `unexpected_error` - unexpected_error
        * `pre_authorization_failed` - pre_authorization_failed
    LocaleEnum:
      enum:
        - en
        - de
      type: string
      description: |-
        * `en` - EN
        * `de` - DE
    NullEnum:
      enum:
        - null
    OCPIOperatorInfo:
      type: object
      description: |-
        Serializer for OCPI operator information.

        Attributes:
            name (str): The name of the operator (required).
            contact: Operator's contact information.
      properties:
        name:
          type: string
        contact:
          allOf:
            - $ref: '#/components/schemas/Contact'
          nullable: true
      required:
        - name
    PaginatedConnectAPIChargingSessionList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 123
