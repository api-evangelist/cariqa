openapi: 3.0.3
info:
  title: Cariqa Connect API
  version: 1.0.0 (v1)
  description: OPENAPI schema of the Cariqa Connect API
paths:
  /api/v1/stations/around/:
    get:
      operationId: stations_around_list
      description: List stations around
      summary: Get Stations Around
      parameters:
        - in: query
          name: connector_types
          schema:
            type: array
            items:
              enum:
                - CHADEMO
                - DOMESTIC_A
                - DOMESTIC_B
                - DOMESTIC_C
                - DOMESTIC_D
                - DOMESTIC_E
                - DOMESTIC_F
                - DOMESTIC_G
                - DOMESTIC_H
                - DOMESTIC_I
                - DOMESTIC_J
                - DOMESTIC_K
                - DOMESTIC_L
                - IEC_60309_2_single_16
                - IEC_60309_2_three_16
                - IEC_60309_2_three_32
                - IEC_60309_2_three_64
                - IEC_62196_T1
                - IEC_62196_T1_COMBO
                - IEC_62196_T2
                - IEC_62196_T2_COMBO
                - IEC_62196_T3A
                - IEC_62196_T3C
                - TESLA_R
                - TESLA_S
              type: string
              description: |-
                * `CHADEMO` - CHADEMO
                * `DOMESTIC_A` - DOMESTIC_A
                * `DOMESTIC_B` - DOMESTIC_B
                * `DOMESTIC_C` - DOMESTIC_C
                * `DOMESTIC_D` - DOMESTIC_D
                * `DOMESTIC_E` - DOMESTIC_E
                * `DOMESTIC_F` - DOMESTIC_F
                * `DOMESTIC_G` - DOMESTIC_G
                * `DOMESTIC_H` - DOMESTIC_H
                * `DOMESTIC_I` - DOMESTIC_I
                * `DOMESTIC_J` - DOMESTIC_J
                * `DOMESTIC_K` - DOMESTIC_K
                * `DOMESTIC_L` - DOMESTIC_L
                * `IEC_60309_2_single_16` - IEC_60309_2_single_16
                * `IEC_60309_2_three_16` - IEC_60309_2_three_16
                * `IEC_60309_2_three_32` - IEC_60309_2_three_32
                * `IEC_60309_2_three_64` - IEC_60309_2_three_64
                * `IEC_62196_T1` - IEC_62196_T1
                * `IEC_62196_T1_COMBO` - IEC_62196_T1_COMBO
                * `IEC_62196_T2` - IEC_62196_T2
                * `IEC_62196_T2_COMBO` - IEC_62196_T2_COMBO
                * `IEC_62196_T3A` - IEC_62196_T3A
                * `IEC_62196_T3C` - IEC_62196_T3C
                * `TESLA_R` - TESLA_R
                * `TESLA_S` - TESLA_S
          description: List of connector types to filter stations
        - in: query
          name: distance
          schema:
            type: integer
            default: 100
          description: Radius to search stations (in meters).
        - in: query
          name: latitude
          schema:
            type: number
            format: double
          description: Latitude of the center of the search area.
          required: true
        - in: query
          name: longitude
          schema:
            type: number
            format: double
          description: Longitude of the center of the search area.
          required: true
        - in: query
          name: only_available
          schema:
            type: boolean
            default: false
          description: Whether to show only available stations
        - in: query
          name: only_partners
          schema:
            type: boolean
            default: false
          description: Whether to show only partner stations
        - in: query
          name: operators
          schema:
            type: array
            items:
              type: string
          description: List of partner operator names to filter stations
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - Stations
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConnectAPIStationList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/stations/details/:
    get:
      operationId: stations_details_retrieve
      description: Retrieve station details
      summary: Get Station Details
      parameters:
        - in: query
          name: id
          schema:
            type: string
            minLength: 1
          required: true
        - in: query
          name: type
          schema:
            enum:
              - evse_id
              - station_id
            type: string
            minLength: 1
          description: |-
            * `evse_id` - evse_id
            * `station_id` - station_id
          required: true
      tags:
        - Stations
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAPIStation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/stations/partners/:
    get:
      operationId: stations_partners_list
      description: Retrieve the list of partner names to use it for filtering
      summary: Partners list
      tags:
        - Stations
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectAPIPartnerFilterOperator'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/v1/stations/tile/:
    get:
      operationId: stations_tile_retrieve
      description: Fetch tile
      summary: Get Map Tile
      parameters:
        - in: query
          name: connector_types
          schema:
            type: array
            items:
              enum:
                - CHADEMO
                - DOMESTIC_A
                - DOMESTIC_B
                - DOMESTIC_C
                - DOMESTIC_D
                - DOMESTIC_E
                - DOMESTIC_F
                - DOMESTIC_G
                - DOMESTIC_H
                - DOMESTIC_I
                - DOMESTIC_J
                - DOMESTIC_K
                - DOMESTIC_L
                - IEC_60309_2_single_16
                - IEC_60309_2_three_16
                - IEC_60309_2_three_32
                - IEC_60309_2_three_64
                - IEC_62196_T1
                - IEC_62196_T1_COMBO
                - IEC_62196_T2
                - IEC_62196_T2_COMBO
                - IEC_62196_T3A
                - IEC_62196_T3C
                - TESLA_R
                - TESLA_S
              type: string
              description: |-
                * `CHADEMO` - CHADEMO
                * `DOMESTIC_A` - DOMESTIC_A
                * `DOMESTIC_B` - DOMESTIC_B
                * `DOMESTIC_C` - DOMESTIC_C
                * `DOMESTIC_D` - DOMESTIC_D
                * `DOMESTIC_E` - DOMESTIC_E
                * `DOMESTIC_F` - DOMESTIC_F
                * `DOMESTIC_G` - DOMESTIC_G
                * `DOMESTIC_H` - DOMESTIC_H
                * `DOMESTIC_I` - DOMESTIC_I
                * `DOMESTIC_J` - DOMESTIC_J
                * `DOMESTIC_K` - DOMESTIC_K
                * `DOMESTIC_L` - DOMESTIC_L
                * `IEC_60309_2_single_16` - IEC_60309_2_single_16
                * `IEC_60309_2_three_16` - IEC_60309_2_three_16
                * `IEC_60309_2_three_32` - IEC_60309_2_three_32
                * `IEC_60309_2_three_64` - IEC_60309_2_three_64
                * `IEC_62196_T1` - IEC_62196_T1
                * `IEC_62196_T1_COMBO` - IEC_62196_T1_COMBO
                * `IEC_62196_T2` - IEC_62196_T2
                * `IEC_62196_T2_COMBO` - IEC_62196_T2_COMBO
                * `IEC_62196_T3A` - IEC_62196_T3A
                * `IEC_62196_T3C` - IEC_62196_T3C
                * `TESLA_R` - TESLA_R
                * `TESLA_S` - TESLA_S
          description: List of connector types to filter stations
        - in: query
          name: max_price
          schema:
            type: number
            format: double
          description: Filter out stations with price higher than this
        - in: query
          name: only_available
          schema:
            type: boolean
            default: false
          description: Whether to show only available stations
        - in: query
          name: only_partners
          schema:
            type: boolean
            default: false
          description: Whether to show only partner stations
        - in: query
          name: operators
          schema:
            type: array
            items:
              type: string
          description: List of partner operator names to filter stations
        - in: query
          name: power_groups
          schema:
            type: array
            items:
              enum:
                - slow
                - fast
                - turbo
              type: string
              description: |-
                * `slow` - slow
                * `fast` - fast
                * `turbo` - turbo
          description: List of power groups to filter stations
        - in: query
          name: x
          schema:
            type: array
            items:
              type: integer
          description: Identifies the X coordinates of the tile in the grid
          required: true
        - in: query
          name: 'y'
          schema:
            type: array
            items:
              type: integer
          description: Identifies the Y coordinates of the tile in the grid
          required: true
        - in: query
          name: z
          schema:
            type: integer
          description: Zoom level
          required: true
      tags:
        - Stations
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAPITileResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/users/:
    get:
      operationId: users_list
      description: Retrieve list of the users
      summary: List Users
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: 'Search user by: id, external_id'
          schema:
            type: string
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConnectAPIUserList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: users_create
      description: Create user
      summary: Create User
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAPIUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnectAPIUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnectAPIUser'
      security:
        - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAPIUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/users/{user_id}/:
    get:
      operationId: users_retrieve
      description: Retrieve user
      summary: Get User
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
          required: true
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAPIUser'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: users_partial_update
      description: Update user
      summary: Update User
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
          required: true
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConnectAPIUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConnectAPIUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConnectAPIUser'
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAPIUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: users_destroy
      description: Soft-delete user
      summary: Soft-delete User
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
          required: true
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/users/{user_id}/billing-details/:
    get:
      operationId: users_billing_details_retrieve
