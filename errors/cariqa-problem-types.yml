format: custom
envelope:
  simple: '{ "detail": "message" }'
  rich: '{ "detail": "message", "error": { "type": "<ErrorTypeEnum>", "details": "message", "payment_intent_client_secret": "pi_..." } }'
  notes: >-
    Cariqa uses a custom error envelope (not RFC 9457 application/problem+json).
