- status: 424
  title: Failed Dependency
  meaning: An external dependency (station data provider or charging provider) was unavailable or rejected the operation.
  seen_on:
  - users_charging_start_create
  - users_charging_stop_create
- status: 500
  title: Internal Server Error
  meaning: An unexpected internal error occurred. A support code (UUID) may be embedded in error.details.
