- status: 403
  title: Forbidden
  meaning: The provided token is invalid or expired.
  remediation: Verify the token value; contact Cariqa support if it should be valid.
- status: 404
  title: Not Found
  meaning: The requested resource (user, session, station or EVSE) was not found or is not accessible in the caller's scope.
- status: 409
  title: Conflict
  meaning: The request is valid but conflicts with current state (session already active/stopped, billing data required, connector out of order).
