  - users_charging_stop_create
problems:
- type: validation_error
  http_status: 400
  title: Validation error
- type: already_charging
  http_status: 409
  title: Already charging
  details: User already has an active charging session or a start request is already being processed.
  remediation: Refresh the active session state; do not retry in a loop.
  source_operation: users_charging_start_create
- type: billing_data_required
  http_status: 409
  title: Billing data required
  details: Billing profile is missing, incomplete, or improperly configured.
  remediation: Ask the customer to complete/update billing data before retrying.
  source_operation: users_charging_start_create
- type: station_availability_issue
  http_status: [409, 424]
  title: Station availability issue
  details: The connector is out of order (409) or station data could not be fetched/validated (424).
  remediation: Choose another connector or retry later after refreshing station details.
  source_operation: users_charging_start_create
- type: payment_error
  http_status: 402
  title: Payment error
  details: An outstanding unpaid session must be settled before starting a new one.
  remediation: Redirect the customer to the outstanding-payments flow.
  source_operation: users_charging_start_create
- type: pre_authorization_failed
  http_status: 402
  title: Pre-authorization failed
  details: The payment method could not be pre-authorized before starting charging; may include payment_intent_client_secret for SCA.
  remediation: If payment_intent_client_secret is present, complete customer authentication, then retry; otherwise choose another payment method.
  source_operation: users_charging_start_create
- type: charging_provider_error
  http_status: 424
  title: Charging provider error
  details: The external charging provider did not successfully start or stop the session.
  remediation: Do not assume the session changed state; refresh and retry after a delay.
  source_operation: [users_charging_start_create, users_charging_stop_create]
- type: already_stopped
  http_status: 409
  title: Already stopped
  details: The charging session is already inactive or has already been stopped.
  remediation: Treat the session as stopped client-side; refresh details.
  source_operation: users_charging_stop_create
- type: unexpected_error
  http_status: 500
  title: Unexpected error
  details: An unexpected internal error occurred; may include a support code UUID.
  remediation: Retry later; capture and provide the support code if present.
  source_operation: [users_charging_start_create, users_charging_stop_create]
- type: payment_method_error
  http_status: 400
  title: Payment method error
- type: temporary_locked
  http_status: 423
  title: Temporarily locked
